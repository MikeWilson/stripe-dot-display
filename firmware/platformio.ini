; Waveshare ESP32-S3-Touch-AMOLED-1.43  (466x466 round AMOLED, N16R8)
;
; Uses the pioarduino platform fork rather than espressif32@6.x: Arduino_GFX
; 1.5 needs ESP32 Arduino core 3.x, and the official PlatformIO platform is
; still on core 2.0.17.
[env:amoled143]
platform      = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board         = esp32-s3-devkitc-1
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600

board_build.arduino.memory_type = qio_opi      ; QIO flash + Octal PSRAM
board_build.flash_mode          = qio
board_upload.flash_size         = 16MB
board_build.partitions          = default_16MB.csv

build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DCORE_DEBUG_LEVEL=2
  -O2

lib_deps =
  moononournation/GFX Library for Arduino @ ^1.5.0
  bblanchon/ArduinoJson @ ^7.1.0
